<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>AJAX Avanzado</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- bootstrap JS required for dropdowns -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body class="container mt-5">



  <h1 class="mb-4">AJAX con API externa</h1>

  <!-- Buscador -->
  <div class="input-group mb-3">
    <input type="text" id="busqueda" class="form-control mb-3" placeholder="Buscar por nombre">
    <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="buttonBuscador" data-bs-toggle="dropdown" aria-expanded="false">Button</button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a id="searchByName" class="dropdown-item" href="#">Buscar por nombre</a></li>
      <li><a id="searchByCity" class="dropdown-item" href="#">Buscar por ciudad</a></li>
    </ul>
  </div>
  <!-- Ordenación -->

  <select id="orden" class="form-select mb-3">

    <option value="asc">Orden A–Z</option>

    <option value="desc">Orden Z–A</option>

  </select>

  <!-- Resultados -->

  <div id="resultado">
    <table class="table table-striped table-hover mt-4">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Username</th>
          <th>ID</th>
          <th>Email</th>
          <th>Ciudad</th>
          <th>Calle</th>
          <th>Suite</th>
          <th>Zip Code</th>
          <th>Geo: lat</th>
          <th>Geo: lng</th>
        </tr>
      </thead>
      <tbody id="body">
      </tbody>
    </table>
  </div>

  <!-- Paginación -->

  <div class="mt-4">

    <p>Mostrando x resultados de y totales</p>

  </div>

  <div class="mt-4">

    <button id="prev" class="btn btn-secondary">Ir primera</button>

    <button id="prev" class="btn btn-secondary">Anterior</button>

    <button id="next" class="btn btn-secondary">Siguiente</button>

    <button id="next" class="btn btn-secondary">Ir última</button>

  </div>

  <script src="script.js"></script>

</body>

</html>
